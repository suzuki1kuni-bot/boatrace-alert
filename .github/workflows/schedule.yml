import requests
from bs4 import BeautifulSoup
import re
import os
import time
from datetime import datetime, timedelta, timezone

# ---------------------------------------------------------
# ⚙️ 設定・定数
# ---------------------------------------------------------
DISCORD_WEBHOOK_URL = os.environ.get("DISCORD_WEBHOOK_URL")

VENUES = [
    "桐生", "戸田", "江戸川", "平和島", "多摩川", "浜名湖", "蒲郡", "常滑", "津", "三国", "びわこ", "住之江",
    "尼崎", "鳴門", "丸亀", "児島", "宮島", "徳山", "下関", "若松", "芦屋", "福岡", "唐津", "大村"
]
VENUE_DICT = {i + 1: name for i, name in enumerate(VENUES)}

# HTTPリクエスト用のセッションとヘッダー
SESSION = requests.Session()
SESSION.headers.update({
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Cache-Control': 'no-cache'
})

# ---------------------------------------------------------
# 🛠️ ユーティリティ関数
# ---------------------------------------------------------
def safe_float(text, default=0.0):
    """文字列から安全に数値を抽出する（ハイフンなどの欠損値対策）"""
    try:
        clean = re.sub(r'[^\d.]', '', str(text))
        return float(clean) if clean else default
    except Exception:
        return default

def fetch_racelist(jcd, rno, date_str):
    """指定した会場・レースの出走表HTMLを取得"""
    url = f"https://www.boatrace.jp/owpc/pc/race/racelist?rno={rno}&jcd={jcd:02d}&hd={date_str}"
    try:
        res = SESSION.get(url, timeout=10)
        res.raise_for_status()
        if "データがありません" in res.text:
            return None
        return BeautifulSoup(res.text, 'html.parser')
    except Exception as e:
        print(f"⚠️ 取得エラー (場:{jcd:02d} {rno}R): {e}")
        return None

def parse_boat_data(tbody):
    """1艇分のHTMLデータをパースして辞書化"""
    tds = tbody.find_all('td')
    if len(tds) < 7: return None

    # 級別 (A1, A2, B1, B2)
    rank_match = re.search(r'(A1|A2|B1|B2)', tds[2].get_text())
    rank = rank_match.group(1) if rank_match else "B1"

    # F持ち数
    f_match = re.search(r'F(\d)', tds[3].get_text())
    f_count = int(f_match.group(1)) if f_match else 0

    # 勝率系 (テキストを空白で分割して取得)
    nat_text = tds[4].get_text(separator=' ').strip().split()
    nat_win = safe_float(nat_text[0]) if len(nat_text) > 0 else 0.0

    loc_text = tds[5].get_text(separator=' ').strip().split()
    loc_win = safe_float(loc_text[0]) if len(loc_text) > 0 else 0.0

    mot_text = tds[6].get_text(separator=' ').strip().split()
    mot_2q = safe_float(mot_text[1]) if len(mot_text) > 1 else 0.0

    return {
        "rank": rank,
        "f_count": f_count,
        "nat_win": nat_win,
        "loc_win": loc_win,
        "mot_2q": mot_2q
    }

def analyze_race(boats):
    """レースデータを評価し、条件に合致すれば理由のリストを返す"""
    if len(boats) != 6: return []
    b1 = boats[0]
    reasons = []

    # 🚨 【条件A】1号艇の構造的欠陥
    if b1["rank"] in ["B1", "B2"]:
        reasons.append("🎯 1号艇がB級")
    if b1["f_count"] >= 1:
        reasons.append(f"⚠️ 1号艇が今節F{b1['f_count']}持ち")
    if b1["mot_2q"] > 0 and b1["mot_2q"] < 30.0:
        reasons.append(f"🔧 1号艇のモーター低調 (2連対率 {b1['mot_2q']}%)")
    if b1["nat_win"] > 0 and b1["loc_win"] < (b1["nat_win"] - 1.0):
        reasons.append(f"🌊 1号艇の当地勝率極低 (全国 {b1['nat_win']} / 当地 {b1['loc_win']})")

    # 🚨 【条件B】2〜5コースの明確な破壊者の存在
    if b1["nat_win"] < 5.0:
        for i in range(1, 5):  # 2号艇(index 1) 〜 5号艇(index 4)
            b = boats[i]
            if b["nat_win"] >= 6.5 and b["mot_2q"] >= 40.0:
                reasons.append(f"⚔️ {i+1}号艇に強破壊者 (勝率 {b['nat_win']} / モーター {b['mot_2q']}%)")
                break

    return reasons

def send_to_discord(messages):
    """DiscordのWebhookに結果を送信"""
    if not DISCORD_WEBHOOK_URL:
        print("Webhook URLが設定されていないため、標準出力のみ行います。")
        return

    content = "🚤 **Morning Scanner: 本日のイン崩壊予兆レース** 🚨\n"
    content += "*(※直前クオンツ分析のターゲット候補)*\n\n"
    content += "\n".join(messages)

    # Discordの2000文字制限対策（分割処理）
    if len(content) > 2000:
        parts = [content[i:i+1900] for i in range(0, len(content), 1900)]
        for part in parts:
            requests.post(DISCORD_WEBHOOK_URL, json={"content": part})
            time.sleep(1)
    else:
        requests.post(DISCORD_WEBHOOK_URL, json={"content": content})

# ---------------------------------------------------------
# 🚀 メイン処理
# ---------------------------------------------------------
def main():
    # GitHub ActionsはUTC実行のため、JST(+9時間)で現在日付を取得
    JST = timezone(timedelta(hours=9), 'JST')
    today_str = datetime.now(JST).strftime("%Y%m%d")
    
    print(f"🔍 スキャン開始: {today_str}")
    target_races = []

    # 全24場・全12レースをループ処理
    for jcd in range(1, 25):
        venue_name = VENUE_DICT[jcd]
        
        # 1Rを取得して、その場でレースが開催されているかチェック
        soup_1r = fetch_racelist(jcd, 1, today_str)
        if not soup_1r:
            print(f"休催 or データ未公開: {venue_name}")
            time.sleep(0.5)
            continue
            
        print(f"✅ 開催確認: {venue_name}")
        
        # 1〜12Rの解析を実行
        for rno in range(1, 13):
            # 1Rは既に取得済みなら流用、それ以外はFetch
            soup = soup_1r if rno == 1 else fetch_racelist(jcd, rno, today_str)
            if not soup:
                time.sleep(0.3)
                continue

            tbodys = soup.find_all('tbody', class_='is-fs12')
            if len(tbodys) < 6:
                continue

            # 各艇のデータをパース
            boats = []
            for w in range(6):
                b_data = parse_boat_data(tbodys[w])
                if b_data: boats.append(b_data)

            # 分析エンジンにかけ、トリガー条件をチェック
            reasons = analyze_race(boats)
            if reasons:
                # レース情報をストック
                race_info = f"**【{venue_name} {rno}R】**\n" + "\n".join(f"  └ {r}" for r in reasons)
                target_races.append(race_info)
                print(f"  🎯 抽出: {venue_name} {rno}R")

            # サーバー負荷軽減のため意図的にディレイ
            time.sleep(0.5)

    # 抽出結果の通知
    if target_races:
        print(f"\n合計 {len(target_races)} レースを抽出しました。Discordへ送信します。")
        send_to_discord(target_races)
    else:
        print("\n本日はイン崩壊条件に合致するレースはありませんでした。")
        send_to_discord(["✅ 本日はイン崩壊の予兆（監視対象）レースはありません。資金を温存します。"])

if __name__ == "__main__":
    main()
